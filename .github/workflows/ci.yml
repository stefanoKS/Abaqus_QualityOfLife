name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Windows is required: the worker uses CREATE_NEW_PROCESS_GROUP, taskkill-based
# process-tree cancellation and Windows batch launcher handling.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # No launcher or converter is configured in CI: no licensed solver
      # execution and no vendor binaries are available here.
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install browser dependencies
        working-directory: apps/web
        run: npm ci

      - name: Translation completeness
        working-directory: apps/web
        run: npm run test:i18n

      - name: TypeScript typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install chromium

      - name: Browser end-to-end tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
